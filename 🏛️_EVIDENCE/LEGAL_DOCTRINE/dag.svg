<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <style>
      .node { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font-family: Arial, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

  <!-- Edges -->
  <path d="M 300 80 Q 220 130 160 160" class="arrow"/>
  <text x="215" y="115" class="edge-label">collision_and_strengthening</text>

  <path d="M 300 80 Q 380 130 440 160" class="arrow"/>
  <text x="385" y="115" class="edge-label">procedural_bypass</text>

  <path d="M 230 180 L 370 180" class="arrow"/>
  <text x="300" y="172" class="edge-label">institutional_realization</text>

  <path d="M 160 200 L 160 290" class="arrow"/>
  <text x="220" y="250" class="edge-label">applied_projection</text>

  <!-- Nodes -->
  <g transform="translate(300, 60)">
    <rect x="-110" y="-25" width="220" height="50" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="0" y="0" class="node" fill="#991b1b">Jus Cogens Invariant</text>
  </g>

  <g transform="translate(160, 180)">
    <rect x="-90" y="-25" width="180" height="50" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
    <text x="0" y="0" class="node" fill="#0369a1">ETS nr. 2 Anchor</text>
  </g>

  <g transform="translate(440, 180)">
    <rect x="-110" y="-25" width="220" height="50" rx="6" fill="#fef3c7" stroke="#fde047" stroke-width="2"/>
    <text x="0" y="0" class="node" fill="#92400e">Geopolitical Genesis of Impunity</text>
  </g>

  <g transform="translate(160, 320)">
    <rect x="-110" y="-25" width="220" height="50" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="0" y="0" class="node" fill="#166534">CASE-MACHERET-1997-2026</text>
  </g>

</svg>
