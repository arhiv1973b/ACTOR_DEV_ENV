<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; }
    .grid { stroke: #30363d; stroke-dasharray: 4; stroke-width: 1; }
    .axis { stroke: #8b949e; stroke-width: 2; }
    .label { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; }
    .line-completed { fill: none; stroke: #238636; stroke-width: 3; }
    .line-pending { fill: none; stroke: #da3633; stroke-width: 3; }
    .dot-completed { fill: #238636; }
    .dot-pending { fill: #da3633; }
    .legend-box { fill: #161b22; stroke: #30363d; rx: 6; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" class="bg" rx="10"/>

  <!-- Title -->
  <text x="60" y="35" class="title">Escalation &amp; Processing Dynamics (Progress Report)</text>

  <!-- Grid & Axes -->
  <line x1="60" y1="390" x2="740" y2="390" class="axis"/>
  <line x1="60" y1="60" x2="60" y2="390" class="axis"/>

  <!-- Horizontal Grid Lines -->
  <line x1="60" y1="60" x2="740" y2="60" class="grid"/>
  <line x1="60" y1="225.0" x2="740" y2="225.0" class="grid"/>
  <text x="50" y="65" class="label" text-anchor="end">9873</text>
  <text x="50" y="230.0" class="label" text-anchor="end">4936</text>
  <text x="50" y="395" class="label" text-anchor="end">0</text>

  <!-- Lines -->
  <path d="M 60.0 390.0 L 400.0 389.5 L 740.0 388.9" class="line-completed"/>
  <path d="M 60.0 60.0 L 400.0 60.5 L 740.0 61.1" class="line-pending"/>

  <!-- Data Dots & Labels -->
  <circle cx="60.0" cy="390.0" r="5" class="dot-completed"/>
  <text x="60.0" y="415" class="label" text-anchor="middle">13:43:37</text>
  <circle cx="400.0" cy="389.5" r="5" class="dot-completed"/>
  <text x="400.0" y="415" class="label" text-anchor="middle">13:45:12</text>
  <circle cx="740.0" cy="388.9" r="5" class="dot-completed"/>
  <text x="740.0" y="415" class="label" text-anchor="middle">13:47:01</text>
  <circle cx="60.0" cy="60.0" r="5" class="dot-pending"/>
  <circle cx="400.0" cy="60.5" r="5" class="dot-pending"/>
  <circle cx="740.0" cy="61.1" r="5" class="dot-pending"/>

  <!-- Legend -->
  <rect x="580" y="20" width="200" height="60" class="legend-box"/>
  <circle cx="600" cy="38" r="5" class="dot-completed"/>
  <text x="615" y="42" class="label">Completed (↑)</text>
  <circle cx="600" cy="60" r="5" class="dot-pending"/>
  <text x="615" y="64" class="label">Pending (↓)</text>
</svg>
