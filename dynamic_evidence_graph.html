<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CASE-MACHERET-1997-2026: Dynamic L2 Graph</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        body { font-family: monospace; background-color: #0d1117; color: #c9d1d9; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #cy { flex-grow: 1; display: block; position: relative; }
        #sidebar { width: 350px; background-color: #161b22; border-left: 1px solid #30363d; padding: 20px; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        h2 { color: #58a6ff; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .detail-block { margin-bottom: 15px; font-size: 12px; }
        .detail-label { color: #8b949e; font-weight: bold; display: block; margin-bottom: 4px; }
        .detail-value { color: #e6edf3; background: #0d1117; padding: 8px; border-radius: 4px; border: 1px solid #21262d; word-wrap: break-word; }
        #loading { position: absolute; top: 20px; left: 20px; background: rgba(218, 54, 51, 0.8); color: white; padding: 5px 10px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="cy">
        <div id="loading">Загрузка манифестов...</div>
    </div>
    <div id="sidebar">
        <h2>Детали узла</h2>
        <div id="node-details">
            <p style="color: #8b949e; font-size: 12px;">Кликните на любой документ или чек в графе, чтобы увидеть метаданные, суммы и привязку к правовой доктрине.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const elements = [
                // Базовый юридический инвариант L0
                { data: { id: 'udhr', label: 'UDHR (Jus Cogens)', type: 'framework', info: 'Всеобщая декларация прав человека' } },
                { data: { id: 'constMD', label: 'Const. MD Art. 4', type: 'framework', info: 'Приоритет международного права над национальным' } },
                { data: { id: 'udhr3', label: 'Art. 3 UDHR', type: 'article', info: 'Право на жизнь, свободу и личную неприкосновенность' } },
                { data: { id: 'udhr5', label: 'Art. 5 UDHR', type: 'article', info: 'Запрет пыток и унижающего обращения (экономическое удушение)' } },
                { data: { id: 'udhr8', label: 'Art. 8 UDHR', type: 'article', info: 'Право на эффективное восстановление в правах' } },
                { data: { id: 'udhr25', label: 'Art. 25 UDHR', type: 'article', info: 'Право на жизненный уровень и средства к существованию' } },
                { data: { id: 'grant', label: 'White House Aid ($1.4M)', type: 'grant', info: 'Целевое финансирование на реституцию' } },

                // Базовые связи иерархии
                { data: { source: 'udhr3', target: 'udhr', label: 'PART_OF' } },
                { data: { source: 'udhr5', target: 'udhr', label: 'PART_OF' } },
                { data: { source: 'udhr8', target: 'udhr', label: 'PART_OF' } },
                { data: { source: 'udhr25', target: 'udhr', label: 'PART_OF' } },
                { data: { source: 'constMD', target: 'udhr', label: 'ENFORCES' } }
            ];

            try {
                // 1. Загрузка данных OCR (Документы)
                const ocrResponse = await fetch('legal_findings_contextual.json');
                if (ocrResponse.ok) {
                    const ocrData = await ocrResponse.json();
                    for (const [filename, data] of Object.entries(ocrData)) {
                        elements.push({
                            data: { 
                                id: filename, 
                                label: filename.substring(0, 15) + '...', 
                                type: 'evidence',
                                info: `Найдены совпадения: ${data.matches.join(', ')}\nДаты: ${data.dates.join(', ')}`
                            }
                        });

                        // Динамическое связывание на основе найденных паттернов
                        const matchesStr = data.matches.join(' ').toLowerCase();
                        if (matchesStr.includes('art') && matchesStr.includes('4') && matchesStr.includes('конституци')) {
                            elements.push({ data: { source: filename, target: 'constMD', label: 'INVOKES' } });
                        }
                        if (matchesStr.includes('art') && matchesStr.includes('3')) elements.push({ data: { source: filename, target: 'udhr3', label: 'VIOLATION_CLAIM' } });
                        if (matchesStr.includes('art') && matchesStr.includes('5')) elements.push({ data: { source: filename, target: 'udhr5', label: 'VIOLATION_CLAIM' } });
                        if (matchesStr.includes('art') && matchesStr.includes('8')) elements.push({ data: { source: filename, target: 'udhr8', label: 'VIOLATION_CLAIM' } });
                        if (matchesStr.includes('art') && matchesStr.includes('25')) elements.push({ data: { source: filename, target: 'udhr25', label: 'VIOLATION_CLAIM' } });
                    }
                }

                // 2. Загрузка финансовых манифестов (Саботаж)
                const finResponse = await fetch('evidence/financial_sabotage/fincombank_receipts_manifest.json');
                if (finResponse.ok) {
                    const finData = await finResponse.json();
                    finData.evidence_items.forEach(item => {
                        elements.push({
                            data: {
                                id: item.receipt_id,
                                label: `${item.amount_mdl} MDL`,
                                type: 'financial',
                                info: `Банк: ${item.bank}\nДата: ${item.date}\nВектор: ${item.vector}\nУщерб: ${item.udhr_infringement}`
                            }
                        });
                        
                        // Связываем транзакции AJUTOR SOCIAL со статьями ВДПЧ и перехватом гранта
                        elements.push({ data: { source: item.receipt_id, target: 'udhr5', label: 'BREACH' } });
                        elements.push({ data: { source: item.receipt_id, target: 'udhr25', label: 'BREACH' } });
                        elements.push({ data: { source: item.receipt_id, target: 'grant', label: 'SUBVERTS' } });
                    });
                }
            } catch (error) {
                console.error("Ошибка загрузки манифестов:", error);
            }

            document.getElementById('loading').style.display = 'none';

            // Инициализация графа
            const cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: [
                    { selector: 'node', style: { 'label': 'data(label)', 'color': '#c9d1d9', 'text-valign': 'bottom', 'text-margin-y': 5, 'font-size': '11px', 'font-family': 'monospace', 'text-background-color': '#0d1117', 'text-background-opacity': 0.8, 'text-background-padding': 2 } },
                    { selector: 'node[type="framework"]', style: { 'background-color': '#da3633', 'shape': 'hexagon', 'width': 60, 'height': 60, 'font-weight': 'bold', 'border-width': 2, 'border-color': '#ff7b72' } },
                    { selector: 'node[type="article"]', style: { 'background-color': '#d29922', 'shape': 'round-rectangle', 'width': 50, 'height': 50 } },
                    { selector: 'node[type="evidence"]', style: { 'background-color': '#58a6ff', 'shape': 'ellipse', 'width': 25, 'height': 25 } },
                    { selector: 'node[type="financial"]', style: { 'background-color': '#238636', 'shape': 'diamond', 'width': 40, 'height': 40 } },
                    { selector: 'node[type="grant"]', style: { 'background-color': '#8957e5', 'shape': 'star', 'width': 70, 'height': 70 } },
                    { selector: 'edge', style: { 'width': 1.5, 'line-color': '#30363d', 'target-arrow-color': '#30363d', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'font-size': '9px', 'color': '#8b949e' } },
                    { selector: 'edge[label="VIOLATION_CLAIM"], edge[label="BREACH"]', style: { 'line-color': '#da3633', 'target-arrow-color': '#da3633', 'line-style': 'dashed' } }
                ],
                layout: { name: 'cose', padding: 50, nodeRepulsion: 150000, idealEdgeLength: 120, edgeElasticity: 100, gravity: 250 }
            });

            // Логика обновления боковой панели при клике
            cy.on('tap', 'node', function(evt){
                const data = evt.target.data();
                document.getElementById('node-details').innerHTML = `
                    <div class="detail-block"><span class="detail-label">ID Узла:</span><div class="detail-value">${data.id}</div></div>
                    <div class="detail-block"><span class="detail-label">Тип:</span><div class="detail-value">${data.type.toUpperCase()}</div></div>
                    <div class="detail-block"><span class="detail-label">Дополнительные данные:</span><div class="detail-value" style="white-space: pre-wrap;">${data.info || 'Нет данных'}</div></div>
                `;
            });
        });
    </script>
</body>
</html>
