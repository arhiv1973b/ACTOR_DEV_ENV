services:
  postgres:
    image: postgres:15-alpine
    container_name: actor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: actor
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - actor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d actor"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: actor_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/actor
      - REGISTRY_PDF=registry/apostille_registry_working_18.signed.pdf
    volumes:
      - ./downloaded_apostilles:/app/downloaded_apostilles
      - ./registry:/app/registry
      - ./artifacts:/app/artifacts
      - ./quarantine:/app/quarantine
      - ./processing:/app/processing
    networks:
      - actor-net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  actor-net:
    driver: bridge
