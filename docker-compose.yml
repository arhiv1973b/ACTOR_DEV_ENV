services:
  actor-app-dev:
    build: .
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - actor-net
    volumes:
      - audit_data:/app/.audit

  actor-audit:
    image: anchore/grype:latest
    depends_on:
      - actor-app-dev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - actor-net
    volumes:
      - audit_data:/app:ro
    environment:
      - GRYPE_DB_AUTO_UPDATE=true
    entrypoint: ["/grype", "/app", "-o", "table"]

  gemini-dockerfile-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: gemini-dockerfile-bridge
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_HOST=http://host.docker.internal:11434
    ports:
      - "8001:8001"
    command: ["python", "-c", "import time; print('Gemini Dockerfile Bridge ready.'); time.sleep(86400)"]
    stdin_open: true
    tty: true
    restart: unless-stopped
