# Override configuration to attach host Docker socket when container Docker integration is required.
# Usage: docker compose -f docker-compose.yml -f docker-compose.with-docker.yml up -d
# Security Risk: Accepted (Host Docker socket exposure).

services:
  mcp-docker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST_ENABLED: "true"
      ACTOR_KEY: "# [⚖ A©tor Declaration]"
    labels:
      - "security.risk=docker.sock-host-control"
      - "security.accepted=true"
