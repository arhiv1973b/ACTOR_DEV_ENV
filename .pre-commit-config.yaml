repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: validate-json-stream
        name: Validate JSON and NDJSON stream logs
        entry: python scripts/validate_ndjson.py
        language: system
        types: [file]
        files: \.(json|ndjson)$
        pass_filenames: true
