name: Registry Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: registry-verification
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.generate.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: pip install -r requirements/ci.txt
      - id: generate
        run: |
          python workflows/download_registry.py
          echo "batches=$(cat registry/batches.json)" >> "$GITHUB_OUTPUT"

  verify:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.discover.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: pip install -r requirements/ci.txt
      - name: Verify Batch
        run: |
          python workflows/verify_batch.py --batch registry/${{ matrix.batch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results-${{ matrix.batch }}
          path: artifacts/
