name: Crypto Manifest Sync, DAG Anchoring & Gemini Integrity Review

on:
  push:
    branches: [ "main", "feature/*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Crypto Manifest & DAG Topology Anchoring
        run: |
          python -c "
          import hashlib, json, datetime, os
          
          # 1. Update ti_ula_crypto_manifest.json
          manifest_path = 'ti_ula_crypto_manifest.json'
          data = {}
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  try:
                      data = json.load(f)
                  except:
                      data = {}
          
          files_to_hash = ['CASE_MACHERET_Analysis_Report.txt', 'theft_evidence_manifest.json', 'MASTER_DOSSIER_FORENSIC_ACT.md', 'Legal_Act_Apostille_Audit_1997_2026.md', 'dag_crypto_anchored.json']
          file_hashes = {}
          for fp in files_to_hash:
              if os.path.exists(fp):
                  with open(fp, 'rb') as f:
                      h = hashlib.sha256(f.read()).hexdigest().upper()
                      file_hashes[fp] = h
          
          data['last_sync'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['file_fingerprints'] = file_hashes
          
          with open(manifest_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
          print('Successfully updated crypto manifest:', manifest_path)

          # 2. Update/Verify DAG Anchored Topology
          dag_path = 'dag_crypto_anchored.json'
          dag_data = {'anchor_timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'nodes': []}
          if os.path.exists(dag_path):
              try:
                  with open(dag_path, 'r', encoding='utf-8') as df:
                      dag_data = json.load(df)
              except:
                  pass
          
          dag_data['nodes'] = [{'file': k, 'sha256': v} for k, v in file_hashes.items()]
          with open(dag_path, 'w', encoding='utf-8') as df:
              json.dump(dag_data, df, indent=4, ensure_ascii=False)
          print('Successfully anchored DAG topology:', dag_path)
          "

      - name: Run Gemini Integrity & Chain of Custody Review
        id: gemini_review
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY not configured. Skipping LLM chain-of-custody report."
          else
            pip install google-genai 2>/dev/null || true
            python -c "
            import os, json
            from google import genai
            client = genai.Client(api_key=os.environ.get('GEMINI_API_KEY'))
            try:
                with open('dag_crypto_anchored.json', 'r') as df:
                    dag_summary = df.read()
                response = client.models.generate_content(
                    model='gemini-2.5-flash',
                    contents=f'Perform a chain of custody and legal integrity check for CASE-MACHERET-1997-2026 involving IDNP 2000001159655 and 25,210,256.15 MDL based on anchored DAG nodes: {dag_summary}'
                )
                print('--- Gemini Chain of Custody Report ---')
                print(response.text)
                with open('gemini_integrity_report.md', 'w', encoding='utf-8') as rf:
                    rf.write('# Gemini Integrity & Chain of Custody Report\n\n' + response.text)
            except Exception as e:
                print('Gemini review error:', e)
            "
          fi

      - name: Simulate Google Drive Mirror Synchronization
        run: |
          echo "Preparing evidence package and manifests for Google Drive mirror sync..."
          mkdir -p gdrive_mirror_staging
          cp ti_ula_crypto_manifest.json gdrive_mirror_staging/
          cp theft_evidence_manifest.json gdrive_mirror_staging/
          cp dag_crypto_anchored.json gdrive_mirror_staging/
          cp CASE_MACHERET_Analysis_Report.txt gdrive_mirror_staging/
          if [ -f "gemini_integrity_report.md" ]; then
            cp gemini_integrity_report.md gdrive_mirror_staging/
          fi
          echo "Staged files for Google Drive mirror bridge successfully."

      - name: Commit and Push Updated Artifacts & Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ti_ula_crypto_manifest.json dag_crypto_anchored.json gemini_integrity_report.md theft_evidence_manifest.json CASE_MACHERET_Analysis_Report.txt || true
          git diff --quiet && git diff --staged --quiet || git commit -m "ci(dag/crypto): auto-anchor DAG topology, sync manifests and generate Gemini integrity report [skip ci]"
          git push || echo "No changes to push or push failed"

      - name: Notify Pipeline Status
        if: always()
        run: |
          echo "=== PIPELINE EXECUTION STATUS ==="
          echo "Status: ${{ job.status }}"
          echo "Target Case: CASE-MACHERET-1997-2026 (IDNP: 2000001159655)"
          echo "Protected Assets: 25,210,256.15 MDL"
          echo "Cryptographic Anchoring & DAG Sync completed."
