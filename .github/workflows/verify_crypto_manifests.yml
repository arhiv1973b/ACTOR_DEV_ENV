name: Crypto Manifest & Evidence Verification CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Run Cryptographic Verification
        run: |
          python -c "
          import json, hashlib, os
          from cryptography.hazmat.primitives.asymmetric import ed25519

          manifest_path = 'manifests/motions/manifest_legal_requirements_e_apostille_pdf.json'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  manifest = json.load(f)

              pub_key_bytes = bytes.fromhex(manifest['cryptography']['public_key'])
              public_key = ed25519.Ed25519PublicKey.from_public_bytes(pub_key_bytes)

              pdf_path = 'Apostilles/файлы удостоверяющие - законные требования - по Е- Апостиль.pdf'
              if os.path.exists(pdf_path):
                  sha256_hash = hashlib.sha256()
                  with open(pdf_path, 'rb') as f:
                      for block in iter(lambda: f.read(4096), b''):
                          sha256_hash.update(block)
                  actual_sha256 = sha256_hash.hexdigest()

                  payload = f\"FILE:{manifest['target_file']}|SHA256:{manifest['file_sha256']}\".encode('utf-8')
                  signature = bytes.fromhex(manifest['cryptography']['signature'])
                  
                  public_key.verify(signature, payload)
                  print('✓ Signature verified successfully.')

                  if actual_sha256 == manifest['file_sha256']:
                      print('✓ SHA-256 hash matches manifest.')
                  else:
                      print('✗ SHA-256 hash mismatch!')
                      exit(1)
              else:
                  print('Target PDF file not found:', pdf_path)
                  exit(1)
          else:
              print('Manifest not found:', manifest_path)
          "
