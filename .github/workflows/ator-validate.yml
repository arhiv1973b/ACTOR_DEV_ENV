name: Validate A©tor Integrity

on:
  push:
    paths:
      - '**/*'
  pull_request:
    paths:
      - '**/*'

jobs:
  validate-ator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run A©tor validator
        run: |
          python3 validate_ator.py
      - name: Audit Encoding & Typographic Matrix (A©tor)
        run: |
          python3 audit_encoding.py
      - name: Upload Encoding Audit Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoding-audit-log
          path: encoding_audit.log
