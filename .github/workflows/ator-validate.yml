name: Validate A©tor Integrity

on:
  push:
    paths:
      - '**/*'
  pull_request:
    paths:
      - '**/*'

jobs:
  validate-ator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run A©tor validator
        run: |
          python3 validate_ator.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test A©tor MCP Server
        run: |
          cd mcp_server
          npm install
          node -e "import('./index.js').then(() => console.log('MCP Server module loaded successfully')).catch(err => { console.error(err); process.exit(1); })"
