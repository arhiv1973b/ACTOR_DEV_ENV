name: AIPS-2025 Integrity Tunnel
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Jus Cogens Integrity
        run: |
          EXPECTED_HASH=$(awk 'NR==1{print $1}' Jus_Cogens_AIPS-2025_Manifest.txt | tr -d $'\r\n ')
          ACTUAL_HASH=$(sha256sum Raport_Jus_Cogens_Macheret_Auto-Deconspirare_Final.pdf | awk '{print $1}' | tr -d $'\r\n ')
          echo "Expected: ${#EXPECTED_HASH} chars: $EXPECTED_HASH"
          echo "Actual:   ${#ACTUAL_HASH} chars: $ACTUAL_HASH"
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "CRITICAL: Integrity Compromised"
            exit 1
          fi
          echo "Integrity Validated: Erga Omnes Lock Active"

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Immutable Evidence Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Immutable evidence snapshot. Case-Macheret-1997-2026. SHA-256 integrity verified by CI before publication. Reference: UN OHCHR / ECHR Ref tw571ryb"
          gh release create "${{ github.ref_name }}" \
            --title "AIPS-2025 Evidence Lock ${{ github.ref_name }}" \
            --notes "$NOTES" \
            Raport_Jus_Cogens_Macheret_Auto-Deconspirare_Final.pdf \
            Jus_Cogens_AIPS-2025_Manifest.txt || echo "Release may already exist"

  zenodo:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      doi: ${{ steps.zenodo_upload.outputs.DOI }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Zenodo and obtain DOI
        id: zenodo_upload
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          HASH=$(awk 'NR==1{print $1}' Jus_Cogens_AIPS-2025_Manifest.txt | tr -d $'\r\n ')

          PAYLOAD=$(jq -n \
            --arg title "AIPS-2025 Evidence Lock ${TAG}: Case-Macheret-1997-2026" \
            --arg desc "Integrity-locked evidence archive. SHA-256: ${HASH}. Reference: UN OHCHR / ECHR Ref tw571ryb" \
            '{metadata:{title:$title,upload_type:"other",description:$desc,
              creators:[{name:"Macheret, Alexei Arturovich"}],
              keywords:["jus cogens","evidence","Case-Macheret-1997-2026","ECHR","OHCHR"],
              notes:"SHA-256 hash verified by GitHub Actions CI before this upload."}}')

          RESPONSE=$(curl -s -X POST \
            "https://zenodo.org/api/deposit/depositions" \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Zenodo create response: $RESPONSE"

          DEPOSITION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])" || (echo "Zenodo API error" && exit 1))
          BUCKET_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['links']['bucket'])")
          echo "Deposition ID: $DEPOSITION_ID"

          curl -s -X PUT \
            "$BUCKET_URL/Raport_Jus_Cogens_Macheret_Auto-Deconspirare_Final.pdf" \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            --upload-file Raport_Jus_Cogens_Macheret_Auto-Deconspirare_Final.pdf

          curl -s -X PUT \
            "$BUCKET_URL/Jus_Cogens_AIPS-2025_Manifest.txt" \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            --upload-file Jus_Cogens_AIPS-2025_Manifest.txt

          PUB=$(curl -s -X POST \
            "https://zenodo.org/api/deposit/depositions/$DEPOSITION_ID/actions/publish" \
            -H "Authorization: Bearer $ZENODO_TOKEN")

          DOI=$(echo "$PUB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('doi','NOT_FOUND'))")
          echo "DOI: $DOI"
          echo "DOI=$DOI" >> $GITHUB_OUTPUT

  zenodo-verify:
    needs: zenodo
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm DOI
        run: |
          DOI="${{ needs.zenodo.outputs.doi }}"
          echo "Published DOI: $DOI"
          if [ "$DOI" = "NOT_FOUND" ] || [ -z "$DOI" ]; then
            echo "ERROR: DOI not obtained"
            exit 1
          fi
          echo "ZENODO LOCK CONFIRMED: $DOI"