name: A©tor Docker Deployment & Strict Gate

on:
  push:
    branches: [ "main", "feature/*" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Step 1 - Strict Ledger Verification (Jus Cogens Gate)
        run: |
          set -e
          echo "=== Executing verify_ledger.py (Strict Gate) ==="
          python3 verify_ledger.py

      - name: Step 2 - Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Step 3 - Log in to Docker Registry
        if: github.event_name != 'pull_request' && secrets.DOCKER_REGISTRY_HOST != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Step 4 - Build and Push A©tor Agent Image
        if: github.event_name != 'pull_request' && secrets.DOCKER_REGISTRY_HOST != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY_HOST }}/actor-agent:latest

      - name: Step 5 - Health Check & Telemetry Recording
        run: |
          echo "=== Executing TSA & Node Health Check ==="
          python3 utils/tsa_health_check.py || true
          echo "✅ Docker deployment pipeline completed successfully under A©tor protocol."
