name: External Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # ежедневный запуск в 05:00

jobs:
  verify-external:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run External Verifier Script
        run: |
          python verify_external_manifest.py

      - name: Commit and push verification report
        run: |
          git config --global user.name "AuditBot"
          git config --global user.email "auditbot@example.com"
          git add External_Verification_Report.md
          git commit -m "Update External Verification Report [skip ci]" || echo "No changes to commit"
          git push origin feature/cyber-sabotage-audit-10-2026 || true
