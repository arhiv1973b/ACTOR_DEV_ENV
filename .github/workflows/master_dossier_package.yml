name: Master Dossier & Package Auto-Sync

on:
  push:
    branches: [ "main", "feature/cyber-sabotage-audit-10-2026" ]
  workflow_dispatch:

jobs:
  build-dossier-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sentence-transformers torch requests

    - name: Run Vector Entity Extractor
      run: python vector_entity_extractor.py

    - name: Generate Markdown Report
      run: python generate_markdown_report.py

    - name: Generate Interactive Entity Graph
      run: python generate_entity_graph_network.py

    - name: Build Master Dossier ZIP Package
      run: python package_master_dossier.py

    - name: Verify Package Existence
      run: |
        ls -lh MASTER_DOSSIER_PACKAGE_2026.zip
        ls -lh VECTOR_ENTITY_EXTRACTION_REPORT.*
        ls -lh entity_graph_network.html
