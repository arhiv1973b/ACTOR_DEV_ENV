name: Validate NDJSON and Audit Logs

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run NDJSON / Audit Log Validator with Fail-Fast
        id: validator
        continue-on-error: true
        run: |
          set -e
          python3 scripts/validate_ndjson.py audit_log.json
          
          for file in $(find . -name "*.ndjson"); do
            python3 scripts/validate_ndjson.py "$file"
          done

      - name: Upload Problem File on Failure
        if: steps.validator.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: invalid-audit-log-py${{ matrix.python-version }}
          path: audit_log.json

      - name: Enforce Job Failure
        if: steps.validator.outcome == 'failure'
        run: exit 1
