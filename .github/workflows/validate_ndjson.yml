name: Validate All JSON, NDJSON and Audit Logs

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Universal JSON / NDJSON Validator with Fail-Fast
        id: validator
        continue-on-error: true
        run: |
          set -e
          echo "=== Finding and validating all JSON & NDJSON files ==="
          
          # Collect all JSON and NDJSON files in repository and artifacts
          FILES=$(find . -type f \( -name "*.json" -o -name "*.ndjson" \) -not -path "*/.*" -not -path "./node_modules/*")
          
          FAILED=0
          for file in $FILES; do
            echo "Validating: $file"
            if ! python3 scripts/validate_ndjson.py "$file"; then
              echo "❌ FAILED: $file"
              FAILED=1
              echo "PROBLEM_FILE=$file" >> $GITHUB_ENV
            fi
          done
          
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Problematic Artifact on Failure
        if: steps.validator.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: invalid-json-py${{ matrix.python-version }}
          path: ${{ env.PROBLEM_FILE }}

      - name: Enforce Job Failure
        if: steps.validator.outcome == 'failure'
        run: exit 1
