name: Nightly Reverification

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reverification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/ci.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt

      - run: |
          python workflows/reverify.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverification-report
          path: artifacts/reverification/
