name: AIPS-2025 Integrity Lock
on: [push, pull_request]
jobs:
  forensic-lock:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git grep -lE "Ator|A_tor|Aotor|A\[©\]" 2>/dev/null; then exit 1; fi
          for f in $(find . -type f \( -name '*.html' -o -name '*.json' -o -name '*.md' \)); do
            iconv -f UTF-8 -t UTF-8 "$f" >/dev/null || exit 1
          done
          mkdir -p .aips-manifests
          sha256sum $(find . -type f \( -name '*.html' -o -name '*.json' -o -name '*.md' \)) > .aips-manifests/latest.sha256
          git config user.name 'A©tor'
          git config user.email 'aips@aips-2025.local'
          git add .aips-manifests/
          git commit -m 'chore(aips): forensic lock updated' || true
      - name: Commit and Push Manifest
        run: |
          git config user.name 'A©tor'
          git config user.email 'aips@integrity.lock'

          # Проверяем наличие изменений
          if [ -n "$(git status --porcelain .aips-manifests/)" ]; then
            git add .aips-manifests/latest.sha256
            git commit -m "chore: update integrity manifest [AIPS-2025]"

            # ВАЖНО: GitHub Actions требует корректный Remote для пуша
            git push origin HEAD:main
          else
            echo "Манифест не изменился, коммит не требуется."
          fi
          git push origin main
