name: Evidence Ledger Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # ежедневный запуск в 06:00

jobs:
  sync-ledger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Evidence Ledger Synchronizer
        run: |
          python update_evidence_ledger.py

      - name: Commit and push ledger updates
        run: |
          git config --global user.name "AuditBot"
          git config --global user.email "auditbot@example.com"
          git add Evidence_Ledger.json
          git commit -m "Automated Evidence Ledger sync [skip ci]" || echo "No changes to commit"
          git push origin feature/cyber-sabotage-audit-10-2026 || true
