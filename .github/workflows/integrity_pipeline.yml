name: Unified Integrity Pipeline & Deployment Gate

on:
  push:
    branches: [ "*" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "*" ]
  schedule:
    - cron: "0 2 * * *"   # Nightly run at 02:00 UTC for full hash audit
  workflow_dispatch:

jobs:
  integrity-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Step 1 - Repair Broken Links & Mirror PDFs
        run: |
          set -e
          echo "=== Running repair_broken_links.py ==="
          python3 scripts/repair_broken_links.py

      - name: Step 2 - Verify Manifest and PDF Links
        run: |
          set -e
          echo "=== Running check_links.py ==="
          python3 check_links.py

      - name: Step 2.5 - Full Checksum Recalculation & Evidence Ledger Builder (Nightly / Release / Dispatch)
        if: github.event_name == 'schedule' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          echo "=== Running generate_checksums.py (Heavyweight Hash Integrity) ==="
          python3 generate_checksums.py
          echo "=== Running build_evidence_ledger.py (Non-Linearity to Linearity Ledger) ==="
          python3 build_evidence_ledger.py

      - name: Step 2.6 - RFC 3161 Timestamp & GPG Sign (Nightly / Release)
        if: github.event_name == 'schedule' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          TSA_POOL_VAR: ${{ vars.TSA_POOL }}
        run: |
          set -e
          echo "=== Acquiring TSA Timestamp (Redundant Pool) ==="
          openssl ts -query -data 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt -cert -sha256 -out request.tsq
          
          if [ -n "$TSA_POOL_VAR" ]; then
            read -r -a TSA_SERVERS <<< "$TSA_POOL_VAR"
          else
            TSA_SERVERS=(
              "https://freetsa.org/tsr"
              "http://timestamp.apple.com/ts01"
              "http://timestamp.digicert.com"
            )
          fi
          
          TSA_SUCCESS=0
          for TSA in "${TSA_SERVERS[@]}"; do
            echo "📡 Requesting timestamp from: $TSA"
            if curl -s -S -f -H "Content-Type: application/timestamp-query" --data-binary @request.tsq "$TSA" -o 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr; then
              if openssl ts -reply -in 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr -text > /dev/null 2>&1; then
                echo "✅ Valid TSA Timestamp acquired from $TSA"
                TSA_SUCCESS=1
                break
              fi
            fi
            echo "⚠️ $TSA unreachable or invalid response. Switching to fallback..."
          done
          
          if [ $TSA_SUCCESS -eq 0 ]; then
            echo "❌ Error: All TSA pool servers failed. Jus Cogens linearity compromised. Blocking execution."
            exit 1
          fi
          rm -f request.tsq

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --detach-sign --armor --output 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt
            echo "Successfully signed CHECKSUMS_SHA256.txt with GPG and timestamped."
          else
            echo "GPG_PRIVATE_KEY secret not found, skipping GPG signing."
          fi

      - name: Step 2.7 - Verify GPG Signature of Manifest (Strict Gate)
        if: github.event_name == 'schedule' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          echo "=== Verifying GPG Signature (Strict Gate) ==="
          if [ -f "05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig" ]; then
            gpg --verify 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt
            echo "✅ GPG Signature verified successfully."
          else
            echo "❌ Error: GPG signature file missing or verification failed. Blocking deployment gate."
            exit 1
          fi

      - name: Step 3 - Validate All JSON and NDJSON Files
        run: |
          set -e
          echo "=== Running universal JSON / NDJSON Validator ==="
          FILES=$(find . -type f \( -name "*.json" -o -name "*.ndjson" \) -not -path "*/.*" -not -path "./node_modules/*")
          JSON_COUNT=0
          for file in $FILES; do
            echo "Validating: $file"
            python3 scripts/validate_ndjson.py "$file"
            JSON_COUNT=$((JSON_COUNT + 1))
          done
          echo "Validated $JSON_COUNT JSON/NDJSON files successfully."
          echo "JSON_COUNT=$JSON_COUNT" >> $GITHUB_ENV

      - name: Step 4 - Generate Comprehensive Audit Summary with ASCII Trend Chart (integrity-summary.md)
        if: always()
        run: |
          python3 -c '
          import json, datetime, hashlib
          from pathlib import Path

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {}
          records = manifest.get("records", [])
          total_records = len(records)
          ok_records = sum(1 for r in records if r.get("status") == "ok")
          restored_records = sum(1 for r in records if "восстановлено" in r.get("notes", "").lower())
          etalon_records = sum(1 for r in records if "эталон" in r.get("notes", "").lower())
          tampered_records = sum(1 for r in records if "tampered" in r.get("status", "").lower())
          other_records = total_records - (ok_records + tampered_records)

          # SHA-256 Ledger checks & Mismatch tracking
          populated_sha256 = sum(1 for r in records if r.get("sha256"))
          null_sha256 = sum(1 for r in records if not r.get("sha256"))
          hash_mismatches = 0
          mismatch_rows = []

          for r in records:
              expected_hash = r.get("sha256")
              filename = r.get("filename")
              if expected_hash and filename:
                  p = Path(filename)
                  if p.exists():
                      file_hash = hashlib.sha256(p.read_bytes()).hexdigest()
                      if file_hash.lower() != expected_hash.lower():
                          hash_mismatches += 1
                          mismatch_rows.append(f"| {r.get(\"id\")} | `{r.get(\"code\")}` | `{expected_hash}` | `{file_hash}` |")

          if mismatch_rows:
              mismatch_section = "## ⚠️ Detected SHA-256 Hash Mismatches\n| ID | Code | Expected SHA-256 | Actual SHA-256 |\n|:---|:---|:---|:---|\n" + "\n".join(mismatch_rows)
          else:
              mismatch_section = "## ⚠️ Detected SHA-256 Hash Mismatches\nNo hash mismatches detected ✅"

          # Audit Log Events aggregation & Temporal Analysis & ASCII Chart
          audit_log_path = Path("audit_log.json")
          total_audit_events = 0
          system_reboots = 0
          event_breakdown = {}
          timeline_counts = {}

          if audit_log_path.exists():
              content = audit_log_path.read_text(encoding="utf-8")
              decoder = json.JSONDecoder()
              pos = 0
              while pos < len(content):
                  while pos < len(content) and content[pos].isspace():
                      pos += 1
                  if pos >= len(content):
                      break
                  try:
                      obj, idx = decoder.raw_decode(content, pos)
                      pos = idx
                      total_audit_events += 1
                      ev = obj.get("event") or obj.get("category") or "general_log"
                      if ev == "system_reboot":
                          system_reboots += 1
                      event_breakdown[ev] = event_breakdown.get(ev, 0) + 1

                      # Temporal parsing
                      ts_raw = obj.get("timestamp")
                      dt_str = "Unknown"
                      if ts_raw is not None:
                          try:
                              if isinstance(ts_raw, (int, float)) or (isinstance(ts_raw, str) and ts_raw.replace(".", "", 1).isdigit()):
                                  dt = datetime.datetime.utcfromtimestamp(float(ts_raw))
                                  dt_str = dt.strftime("%Y-%m-%d")
                              elif isinstance(ts_raw, str):
                                  dt = datetime.datetime.fromisoformat(ts_raw.replace("Z", "+00:00").split("+")[0])
                                  dt_str = dt.strftime("%Y-%m-%d")
                          except Exception:
                              dt_str = "Invalid/Other"
                      timeline_counts[dt_str] = timeline_counts.get(dt_str, 0) + 1
                  except Exception:
                      break

          event_rows = [f"| `{ev}` | {cnt} |" for ev, cnt in event_breakdown.items()]
          event_table = "| Event Type | Count |\n|:---|:---|\n" + ("\n".join(event_rows) if event_rows else "| (None) | 0 |")

          timeline_rows = [f"| `{date}` | {cnt} |" for date, cnt in sorted(timeline_counts.items(), reverse=True)]
          timeline_table = "| Date (UTC) | Event Count |\n|:---|:---|\n" + ("\n".join(timeline_rows) if timeline_rows else "| (No timestamps) | 0 |")

          # ASCII Trend Chart Generation
          max_count = max(timeline_counts.values()) if timeline_counts else 1
          bar_max_width = 30
          ascii_lines = []
          for date_str, cnt in sorted(timeline_counts.items()):
              bar_len = int((cnt / max_count) * bar_max_width) if max_count > 0 else 0
              bar = "█" * bar_len
              ascii_lines.append(f"`{date_str}` | {cnt:3d} | {bar}")
          ascii_chart = "```text\n" + ("\n".join(ascii_lines) if ascii_lines else "No data") + "\n```"

          table_rows = []
          for r in records:
              table_rows.append(f"| {r.get(\"id\")} | `{r.get(\"code\")}` | {r.get(\"status\")} | {r.get(\"sha256\") or \"null\"} | {r.get(\"notes\")} |")

          timestamp = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
          status = "${{ job.status }}"
          cat_status = "Passed ✅" if status == "success" else "Failed ❌"

          summary_content = f"""# 🛡️ Unified Integrity & Audit Summary Report

- **Timestamp**: {timestamp}
- **Python Version**: ${{ matrix.python-version }}
- **Pipeline Status**: {cat_status}
- **Manifest Version**: {manifest.get("version", "N/A")}
- **Base URL**: {manifest.get("base_url", "N/A")}

## 📊 Aggregated Totals & Ledger Statistics
- **Total Records in Manifest**: {total_records}
- **OK / Valid**: {ok_records}
- **Baseline / Etalon**: {etalon_records}
- **Restored from Original**: {restored_records}
- **Tampered / Empty**: {tampered_records}
- **Other**: {other_records}
- **JSON Files Checked**: ${{ env.JSON_COUNT }}

## 🔐 SHA-256 Hash Integrity Summary
- **Populated SHA-256 Hashes**: {populated_sha256}
- **Null SHA-256 Hashes**: {null_sha256}
- **Hash Mismatches Detected**: {hash_mismatches}

{mismatch_section}

## 📜 Audit Log Events Summary (`audit_log.json`)
- **Total Logged Events**: {total_audit_events}
- **System Reboots Recorded**: {system_reboots}

{event_table}

## 📈 Temporal Analysis & Event Distribution (UTC)
{timeline_table}

### 📊 Event Trend Visualization (ASCII Chart)
{ascii_chart}

## 📑 Apostille Ledger Records Table
| ID | Code | Status | SHA-256 | Notes |
|:---|:---|:---|:---|:---|
""" + "\n".join(table_rows) + f"""

---
*Generated automatically by GitHub Actions Unified Integrity Pipeline.*
"""
          Path("integrity-summary.md").write_text(summary_content, encoding="utf-8")
          print("Successfully generated integrity-summary.md with ASCII trend chart.")
          '

      - name: Step 5 - Upload Integrity Audit Report & Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-audit-report-py${{ matrix.python-version }}
          path: |
            manifest.json
            audit_log.json
            check_report.json
            integrity-summary.md
          if-no-files-found: ignore

      - name: Step 6 - Upload Crypto Checksums Manifest, TSA & Verify Report (Nightly / Release)
        if: always() && (github.event_name == 'schedule' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: crypto-checksums-manifest-py${{ matrix.python-version }}
          path: |
            05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt
            05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig
            05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr
            05_CRYPTO_MANIFESTS/ACTOR_MANIFEST_SIGNATURE.json
            verify-report.md
          if-no-files-found: ignore

  verify-gate:
    needs: integrity-pipeline
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Download Crypto Checksums Artifact
        uses: actions/download-artifact@v4
        with:
          name: crypto-checksums-manifest-py3.10
          path: 05_CRYPTO_MANIFESTS/
        continue-on-error: true

      - name: Strict GPG Verification & SHA-256 Hash Cross-Check Gate
        run: |
          set -e
          echo "=== Executing Independent Verify Gate (Signature & Hash Check) ==="
          if [ -f "05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig" ] && [ -f "05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt" ]; then
            gpg --verify 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt
            echo "✅ Verify Gate: GPG signature valid."

            echo "=== Cross-checking file SHA-256 hashes against signed manifest ==="
            python3 -c '
            import hashlib, datetime
            from pathlib import Path

            manifest = Path("05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt")
            mismatches = 0
            total = 0
            checked_rows = []
            
            for line in manifest.read_text(encoding="utf-8").splitlines():
                if not line.strip():
                    continue
                parts = line.split(maxsplit=1)
                if len(parts) == 2:
                    expected_hash, filepath = parts[0].strip(), parts[1].strip()
                    p = Path(filepath)
                    if p.exists():
                        total += 1
                        actual_hash = hashlib.sha256(p.read_bytes()).hexdigest()
                        is_match = (actual_hash.lower() == expected_hash.lower())
                        if not is_match:
                            mismatches += 1
                            checked_rows.append(f"| `{filepath}` | `FAIL` | `{expected_hash[:12]}...` | `{actual_hash[:12]}...` |")
                        else:
                            checked_rows.append(f"| `{filepath}` | `OK` | `{expected_hash[:12]}...` | - |")
                    else:
                        checked_rows.append(f"| `{filepath}` | `MISSING` | `{expected_hash[:12]}...` | N/A |")

            timestamp = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
            status_text = "PASSED ✅" if mismatches == 0 else "FAILED ❌"
            
            report_content = f"""# 🛡️ Cryptographic Verify Gate Report
- **Timestamp**: {timestamp}
- **Gate Status**: {status_text}
- **Total Files Verified**: {total}
- **Hash Mismatches**: {mismatches}

## 📋 File Verification Matrix
| File Path | Status | Expected SHA-256 (prefix) | Actual SHA-256 / Notes |
|:---|:---|:---|:---|
""" + "\n".join(checked_rows) + "\n\n---\n*Generated automatically by Verify Gate Action.*"
            
            Path("verify-report.md").write_text(report_content, encoding="utf-8")
            print(f"Generated verify-report.md. Total: {total}, Mismatches: {mismatches}")
            if mismatches > 0:
                exit(1)
            '
            echo "✅ Verify Gate: All file hashes match reference manifest."
          else
            echo "⚠️ Signature file not present (or Push/PR run), verification skipped safely."
            echo "# 🛡️ Cryptographic Verify Gate Report\n- **Status**: SKIPPED (Push/PR run)" > verify-report.md
          fi

      - name: Strict Dynamic Multi-TSA Verification Gate
        run: |
          set -e
          echo "=== Executing Dynamic Multi-TSA Verification Gate ==="
          if [ -f "05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr" ]; then
            TSA_INFO=$(openssl ts -reply -in 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr -text || echo "")
            echo "Detected TSA Info:"
            echo "$TSA_INFO"
            
            if echo "$TSA_INFO" | grep -qi "FreeTSA"; then
              echo "Issuer identified as FreeTSA"
              wget -q https://freetsa.org/files/tsa.crt -O tsa.crt
              wget -q https://freetsa.org/files/cacert.pem -O cacert.pem
              openssl ts -verify -data 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt -in 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr -CAfile cacert.pem -untrusted tsa.crt
            elif echo "$TSA_INFO" | grep -qi -E "Apple|DigiCert"; then
              echo "Issuer identified as Enterprise TSA (Apple/DigiCert)"
              openssl ts -verify -data 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt -in 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr || openssl ts -verify -data 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt -in 05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr -untrusted /etc/ssl/certs/ca-certificates.crt
            else
              echo "❌ Error: Unknown or unauthorized TSA issuer. Blocking verification gate."
              exit 1
            fi
            echo "✅ Dynamic TSA Gate: Timestamp verified successfully."
          else
            echo "⚠️ TSA file not present, verification skipped safely."
          fi

      - name: Upload Verify Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-gate-report
          path: verify-report.md
          if-no-files-found: ignore

  erga-omnes-mirror:
    needs: verify-gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Download Verification Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: verify-gate-report
          path: .
          if-no-files-found: ignore

      - name: Download Crypto Checksums Artifact
        uses: actions/download-artifact@v4
        with:
          name: crypto-checksums-manifest-py3.10
          path: 05_CRYPTO_MANIFESTS/
          if-no-files-found: ignore

      - name: Mirror to Public Erga Omnes Repository
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -n "$MIRROR_PUSH_TOKEN" ]; then
            git config --global user.name "A©tor"
            git config --global user.email "alexeimaceret7@gmail.com"
            
            git clone https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/arhiv1973b/evidence-pdfs-mirror.git mirror_repo
            cd mirror_repo
            
            cp ../audit_log.ndjson ./ || true
            cp ../verify-report.md ./ || true
            cp ../05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt ./ || true
            cp ../05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.txt.sig ./ || true
            cp ../05_CRYPTO_MANIFESTS/CHECKSUMS_SHA256.tsr ./ || true
            
            git add audit_log.ndjson verify-report.md CHECKSUMS_SHA256.txt CHECKSUMS_SHA256.tsr CHECKSUMS_SHA256.txt.sig || true
            git commit -m "A©TOR_KEY=\"# [⚖ A©tor Declaration]\" Erga Omnes evidence mirror synchronization" || echo "No changes to commit"
            git push origin main || echo "Push skipped or failed"
          else
            echo "MIRROR_PUSH_TOKEN secret not provided, skipping mirror sync."
          fi

  deploy-gate:
    needs: [integrity-pipeline, verify-gate, erga-omnes-mirror]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Integrity Gate Passed
        run: |
          echo "✅ All integrity checks and verification gates passed successfully. Ready for deployment / GitHub Pages publish."
