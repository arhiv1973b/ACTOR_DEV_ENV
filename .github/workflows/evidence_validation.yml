name: Evidence Assembly & Knowledge Tokens Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Validate JSON artifacts (actor_knowledge_tokens.json & evidence_assembly_map.json)
        run: |
          python -c "
          import json, os, sys
          
          # 1. Validate actor_knowledge_tokens.json
          token_path = 'actor_knowledge_tokens.json'
          if not os.path.exists(token_path):
              print(f'[X] Missing {token_path}')
              sys.exit(1)
          
          with open(token_path, 'r', encoding='utf-8') as f:
              tokens = json.load(f)
          
          print(f'[OK] Loaded {token_path} successfully.')
          
          # Verify identity anchor IDNP
          idnp = tokens.get('identity_anchor', {}).get('idnp')
          if idnp != '2000001159655':
              print(f'[X] Invalid IDNP anchor: {idnp}')
              sys.exit(1)
          print('[OK] Identity anchor IDNP 2000001159655 verified.')
          
          # 2. Validate evidence_assembly_map.json (if present)
          map_path = 'evidence_assembly_map.json'
          if os.path.exists(map_path):
              with open(map_path, 'r', encoding='utf-8') as f:
                  emap = json.load(f)
              print(f'[OK] Loaded {map_path} with {len(emap)} evidence mappings.')
          else:
              print('[INFO] evidence_assembly_map.json not present in static repo (zero-duplication GDrive mirror map).')
          "

      - name: Run Integrity Witness Verification
        run: |
          if [ -f "generate_integrity_witness.py" ]; then
              python generate_integrity_witness.py
              echo "[OK] Integrity witness generation passed."
          else
              echo "[WARNING] generate_integrity_witness.py not found."
          fi
