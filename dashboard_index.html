<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jus Cogens Forensic & Vector Metrics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .status-shield { padding: 15px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 1.2em; }
        .shield-pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .shield-fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .tag-critical { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .tag-high { background: #e67e22; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; }
        .tag-medium { background: #f1c40f; color: #333; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Квантовый Аудит: Векторная Аналитика Jus Cogens & ВДПЧ</h1>
        
        <div id="shieldBanner" class="status-shield shield-pass">
            Процедурный Щит: ЗАГРУЗКА МЕТРИК...
        </div>

        <div class="grid">
            <div class="card">
                <h3>Частота Врубовых Векторов (Bar)</h3>
                <canvas id="vectorsBarChart"></canvas>
            </div>
            <div class="card">
                <h3>Распределение Сверити (Doughnut)</h3>
                <canvas id="vectorsPieChart"></canvas>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Системный Реестр Векторных Метрик (vector_metrics.json)</h3>
            <table id="metricsTable">
                <thead>
                    <tr>
                        <th>Вектор Нарушения</th>
                        <th>Уровень (Severity)</th>
                        <th>Частота</th>
                        <th>Вес</th>
                        <th>Порог</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Данные загружаются через fetch -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadMetrics() {
            try {
                const response = await fetch('vector_metrics.json');
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error('Failed to load vector_metrics.json:', error);
                document.getElementById('shieldBanner').className = 'status-shield shield-fail';
                document.getElementById('shieldBanner').innerText = 'ОШИБКА ЗАГРУЗКИ vector_metrics.json';
            }
        }

        function renderDashboard(data) {
            const shield = document.getElementById('shieldBanner');
            if (data.has_critical_violations) {
                shield.className = 'status-shield shield-fail';
                shield.innerText = 'ПРОЦЕДУРНЫЙ ЩИТ: КРИТИЧЕСКИЕ НАРУШЕНИЯ JUS COGENS ПРЕВЫШАЮТ ПОРОГ НУЛЬ-ТЕРПИМОСТИ';
            } else {
                shield.className = 'status-shield shield-pass';
                shield.innerText = 'ПРОЦЕДУРНЫЙ ЩИТ: ВСЕ ВЕКТОРЫ В ПРЕДЕЛАХ ДОПУСКА';
            }

            const tbody = document.querySelector('#metricsTable tbody');
            tbody.innerHTML = '';

            let labels = [];
            let frequencies = [];
            let severityCounts = { "CRITICAL": 0, "HIGH": 0, "MEDIUM": 0 };

            data.vectors.forEach(v => {
                labels.push(v.vector_name);
                frequencies.push(v.frequency);
                severityCounts[v.severity] = (severityCounts[v.severity] || 0) + v.frequency;

                const tr = document.createElement('tr');
                let tagClass = 'tag-medium';
                if (v.severity === 'CRITICAL') tagClass = 'tag-critical';
                else if (v.severity === 'HIGH') tagClass = 'tag-high';

                tr.innerHTML = `
                    <td>${v.vector_name}</td>
                    <td><span class="${tagClass}">${v.severity}</span></td>
                    <td>${v.frequency}</td>
                    <td>${v.weight}</td>
                    <td>${v.threshold}</td>
                `;
                tbody.appendChild(tr);
            });

            // Bar Chart
            const ctxBar = document.getElementById('vectorsBarChart').getContext('2d');
            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Частота срабатывания',
                        data: frequencies,
                        backgroundColor: 'rgba(231, 76, 60, 0.6)',
                        borderColor: 'rgba(192, 57, 43, 1)',
                        borderWidth: 1
                    }]
                },
                options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            // Pie/Doughnut Chart
            const ctxPie = document.getElementById('vectorsPieChart').getContext('2d');
            new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(severityCounts),
                    datasets: [{
                        data: Object.values(severityCounts),
                        backgroundColor: ['#e74c3c', '#e67e22', '#f1c40f']
                    }]
                }
            });
        }

        loadMetrics();
    </script>
</body>
</html>
