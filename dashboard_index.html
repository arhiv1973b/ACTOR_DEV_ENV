<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jus Cogens Forensic Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .status-shield { padding: 15px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 1.2em; }
        .shield-pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .shield-fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .tag-rejected { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; }
        .tag-valid { background: #2ecc71; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Квантовый Аудит: Jus Cogens & ВДПЧ</h1>
        
        <div id="shieldBanner" class="status-shield shield-pass">
            Процедурный Щит: АНАЛИЗ...
        </div>

        <div class="grid">
            <div class="card">
                <h3>Статистика по Векторам</h3>
                <canvas id="vectorsChart"></canvas>
            </div>
            <div class="card">
                <h3>Сводка Досье</h3>
                <p><strong>Последняя проверка:</strong> <span id="auditDate">-</span></p>
                <p><strong>Проверено документов:</strong> <span id="totalDocs">-</span></p>
                <p><strong>Нарушений найдено:</strong> <span id="totalViolations">-</span></p>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Реестр Проверенных Документов</h3>
            <table id="docsTable">
                <thead>
                    <tr>
                        <th>Файл</th>
                        <th>Статус</th>
                        <th>Макс. Вес</th>
                        <th>Триггеры (Векторы)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Данные будут загружены динамически -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const mockData = {
            "audit_timestamp_utc": "2026-10-08T19:21:29Z",
            "total_files_checked": 3,
            "has_violations": true,
            "results": [
                {
                    "filename": "sample_court_decision.txt",
                    "status": "REJECTED_CONDITIONAL",
                    "max_weight": 0.85,
                    "triggered_vectors": [{"vector_name": "Fair Trial", "weight": 0.85}]
                },
                {
                    "filename": "contract_01.txt",
                    "status": "VALID",
                    "max_weight": 0.0,
                    "triggered_vectors": []
                },
                {
                    "filename": "illegal_decree.txt",
                    "status": "REJECTED",
                    "max_weight": 1.0,
                    "triggered_vectors": [{"vector_name": "Torture", "weight": 1.0}, {"vector_name": "Arbitrary Arrest", "weight": 0.8}]
                }
            ]
        };

        function renderDashboard(data) {
            const shield = document.getElementById('shieldBanner');
            if (data.has_violations) {
                shield.className = 'status-shield shield-fail';
                shield.innerText = 'ПРОЦЕДУРНЫЙ ЩИТ: ОБНАРУЖЕНО НАРУШЕНИЕ ИМПЕРАТИВНЫХ НОРМ (СЛИЯНИЕ ЗАБЛОКИРОВАНО)';
            } else {
                shield.className = 'status-shield shield-pass';
                shield.innerText = 'ПРОЦЕДУРНЫЙ ЩИТ: АРТЕФАКТЫ ВАЛИДНЫ (jus cogens соблюдены)';
            }

            document.getElementById('auditDate').innerText = new Date(data.audit_timestamp_utc).toLocaleString('ru-RU');
            document.getElementById('totalDocs').innerText = data.total_files_checked;
            
            let violationCount = data.results.filter(r => r.status.includes('REJECTED')).length;
            document.getElementById('totalViolations').innerText = violationCount;

            const tbody = document.querySelector('#docsTable tbody');
            let vectorCounts = {};

            data.results.forEach(doc => {
                const tr = document.createElement('tr');
                const tagClass = doc.status.includes('REJECTED') ? 'tag-rejected' : 'tag-valid';
                const vectorsStr = doc.triggered_vectors.map(v => v.vector_name).join(', ') || 'Нет';
                
                tr.innerHTML = `
                    <td>${doc.filename}</td>
                    <td><span class="${tagClass}">${doc.status}</span></td>
                    <td>${doc.max_weight}</td>
                    <td>${vectorsStr}</td>
                `;
                tbody.appendChild(tr);

                doc.triggered_vectors.forEach(v => {
                    vectorCounts[v.vector_name] = (vectorCounts[v.vector_name] || 0) + 1;
                });
            });

            const ctx = document.getElementById('vectorsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(vectorCounts),
                    datasets: [{
                        label: 'Количество срабатываний векторов',
                        data: Object.values(vectorCounts),
                        backgroundColor: 'rgba(52, 152, 219, 0.6)',
                        borderColor: 'rgba(41, 128, 185, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        renderDashboard(mockData);
    </script>
</body>
</html>
