findings:
  - surname_variant: "MACERET"
    context: "Atostit în actele personale (act de naștere, buletin de identitate, pașaport) emise de autoritățile RM."
    origin: "Variantă a numelui de familie de origine evreiască МАЧЕРЕТ, preluată din actele emise în limba rusă în perioada sovietică conform normelor de transcriere (Legea cu privire la funcționarea limbilor vorbite pe teritoriul RSS Moldova din 31 august 1989)."
  - surname_variant: "MACHERET"
    context: "Înregistrat în actele emise de autoritățile competente din Statele Unite ale Americii (pentru ARTUR MACHERET / legătura cu dosarul)."
    origin: "Echivalent cu MACERET / МАЧЕРЕТ, variantă ortografiată conform normelor de redare a numelor în limba engleză."
  - surname_variant: "МАЧЕРЕТ"
    context: "Forma istorică din actele sovietice în limba rusă."

conclusion:
  statement: "Numele de familie MACHERET și MACERET, înregistrate în diverse acte ale titularului de dosar MACERET ALEXEI, emise în diferite limbi de autorități competente din diferite țări, pot fi considerate echivalente antonimice [antronimice], adică nume identice, purtate de membrii uneia și aceleiași familii."
