services:
  mcp-docker:
    build: .
    container_name: mcp-docker
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./run:/run
      - ./forensic_air_gapped_audit.py:/app/forensic_air_gapped_audit.py:ro
      - ${AUDIT_DATA_PATH:-./audit_data}:/audit_data:ro
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      MCP_LOG_LEVEL: debug
    restart: unless-stopped
